[package]
name = "rustlego"
version = "0.1.0"
edition = "2021"
description = "LegoFuzz-inspired Rust code generation with LLM templates"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = { version = "0.8", features = ["small_rng"] }
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
regex = "1.0"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "generate"
path = "src/bin/generate.rs"

[[bin]]
name = "compose"
path = "src/bin/compose.rs"

[[bin]]
name = "pipeline"
path = "src/bin/pipeline.rs"